# Local development config for `supabase start`. Unlisted settings use CLI defaults.
project_id = "nashville-takeover"

[api]
# Only `public` is exposed over the API; helper functions live in `private`.
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[edge_runtime]
enabled = true
